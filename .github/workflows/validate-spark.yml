name: Validate Dockerized Spark Sales Analysis

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Spark job in Docker
        run: docker compose run --build --rm sales-analysis

      - name: Verify generated outputs
        run: python3 scripts/verify_outputs.py

      - name: Upload generated result files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spark-sales-analysis-results
          path: output/
          if-no-files-found: error
          retention-days: 7
